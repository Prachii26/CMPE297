# Same OpenRouter routing pattern as Assignment2/partB/openrouter.patch.yml
# -- apiKeyEnv is a credential REFERENCE (an env var name), resolved per
# request through the harness credential seam. No secret enters this file.
#
# Originally deepseek/deepseek-v4-flash-0731:free (used for the real
# 10-iteration run in runs/ledger.jsonl); that model's free tier was
# retired by 2026-09-20, so this points at a re-verified replacement --
# see Assignment2/README.md for the dated note.
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      openrouter:
        displayName: OpenRouter
        apiKeyEnv: OPENROUTER_API_KEY
        api: openai-completions
        baseURL: https://openrouter.ai/api/v1
        models:
          - id: liquid/lfm-2.5-2.6b:free
            name: LFM 2.5 (free, via OpenRouter)
            contextWindow: 32768
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: openrouter
    model: liquid/lfm-2.5-2.6b:free
